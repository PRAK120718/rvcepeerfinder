<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Aspiration - RVCE Peer Finder</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../aspirations.js"></script>
</head>

<body>
    <div class="wireframe-container">
        <div class="wireframe-header">
            <a href="00-otp-verification.html" class="back-btn">←</a>
            <h1>Your Journey</h1>
            <div style="width: 40px;"></div>
        </div>
        <div class="wireframe-content">
            <div style="text-align: center; margin-bottom: 40px;">
                <h2 style="font-size: 1.8em; line-height: 1.2;">What are you chasing today?</h2>
                <p style="color: var(--text-dim); margin-top: 12px; font-size: 1em;">
                    Select an active goal or start a new pursuit.
                </p>
            </div>

            <div id="aspirationsList">
                <!-- Aspirations will be loaded here -->
            </div>

            <div style="margin-top: 32px;">
                <button class="btn btn-outline"
                    style="border-style: dashed; width: 100%; border-radius: 20px; color: var(--primary); border-color: var(--primary);"
                    onclick="window.location.href='27-new-aspiration.html'">
                    + New Aspiration
                </button>
            </div>

            <div
                style="margin-top: 48px; padding: 20px; background: rgba(99, 102, 241, 0.05); border-radius: 24px; border: 1px solid rgba(99, 102, 241, 0.1);">
                <p style="font-size: 0.85em; color: var(--text-dim); margin: 0;">
                    <strong style="color: var(--primary);">✨ Neo-Tip:</strong> Each aspiration gets its own AI brain.
                    Switch goals anytime.
                </p>
            </div>
        </div>
    </div>

    <script>
        // Check if user is authenticated
        window.addEventListener('DOMContentLoaded', function () {
            const isAuthenticated = localStorage.getItem('rvce_authenticated') === 'true';
            if (!isAuthenticated) {
                window.location.href = '00-landing.html';
                return;
            }

            // Load aspirations after authentication check
            loadAspirations();
        });

        function loadAspirations() {
            const aspirations = getAllAspirations();
            const listContainer = document.getElementById('aspirationsList');

            if (aspirations.length === 0) {
                listContainer.innerHTML = `
                    <div class="card" style="cursor: default; text-align: center; padding: 40px 20px;">
                        <p style="color: #7f8c8d;">No aspirations found. Let's create your first one!</p>
                        <button class="btn btn-primary" style="margin-top: 20px;" onclick="window.location.href='27-new-aspiration.html'">
                            Create First Aspiration
                        </button>
                    </div>
                `;
                return;
            }

            // Filter active aspirations (you can modify to show all or filter by status)
            const activeAspirations = aspirations.filter(asp => asp.status === 'active');

            if (activeAspirations.length === 0) {
                listContainer.innerHTML = `
                    <div class="card" style="cursor: default; text-align: center; padding: 40px 20px;">
                        <p style="color: #7f8c8d;">No active aspirations. Create a new one to get started!</p>
                        <button class="btn btn-primary" style="margin-top: 20px;" onclick="window.location.href='27-new-aspiration.html'">
                            Create New Aspiration
                        </button>
                    </div>
                `;
                return;
            }

            // Display aspirations
            listContainer.innerHTML = activeAspirations.map(aspiration => {
                return `
                    <div class="card" style="cursor: pointer; margin-bottom: 15px;" onclick="selectAspiration('${aspiration.id}')">
                        <div class="card-header">
                            <div>
                                <div class="card-title">${escapeHtml(aspiration.name)}</div>
                                ${aspiration.description ? `<div class="card-subtitle">${escapeHtml(aspiration.description.substring(0, 100))}${aspiration.description.length > 100 ? '...' : ''}</div>` : ''}
                            </div>
                            <span class="badge badge-match">Active</span>
                        </div>
                        <div style="padding: 10px 0; color: #3498db; font-weight: 600;">
                            Continue →
                        </div>
                    </div>
                `;
            }).join('');
        }

        function selectAspiration(aspirationId) {
            const aspiration = getAspirationById(aspirationId);
            if (!aspiration) {
                alert('Aspiration not found. Please try again.');
                loadAspirations();
                return;
            }

            // Set as current aspiration
            localStorage.setItem('current_aspiration', JSON.stringify({
                id: aspiration.id,
                name: aspiration.name,
                createdAt: aspiration.createdAt
            }));

            // Check discovery method
            const discoveryMethod = localStorage.getItem('neopeer_discovery_method') || 'ai-agent';

            if (discoveryMethod === 'self-based') {
                // Navigate to questionnaire
                window.location.href = '32-questionnaire.html';
            } else {
                // Navigate to goal selection
                window.location.href = '32-peer-mentor-selection.html';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
