<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recommended Students - RVCE Peer Finder</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="../aspirations.js"></script>
</head>
<body>
    <div class="wireframe-container">
        <div class="wireframe-header">
            <a href="32-questionnaire.html" class="back-btn">← Back</a>
            <h1 id="aspirationTitle">Recommended Peers</h1>
            <a href="21-settings.html" class="back-btn" style="font-size: 0.85em;">⚙️</a>
        </div>
        <div class="wireframe-content" style="padding: 0;">
            <div style="padding: 15px 20px; background: #f8f9fa; border-bottom: 1px solid #e0e0e0;">
                <p style="color: #7f8c8d; font-size: 0.9em;">
                    Based on your questionnaire responses, we found <span id="matchCount">10</span> potential matches (sorted by match percentage)
                </p>
            </div>
            
            <div style="padding: 15px 20px; background: #fff3cd; border-bottom: 1px solid #e0e0e0;">
                <p style="color: #856404; font-size: 0.85em; text-align: center;">
                    🔒 All students remain anonymous until mutual match
                </p>
            </div>
            
            <div id="studentsList">
                <!-- Students will be loaded here -->
            </div>
            
            <div style="padding: 20px; background: #f8f9fa; border-top: 1px solid #e0e0e0;">
                <p style="font-size: 0.9em; color: #7f8c8d; text-align: center;">
                    Select students you'd like to meet. They'll receive a request and can choose to accept or decline.
                </p>
            </div>
            
            <div style="padding: 15px 20px; background: white; border-top: 1px solid #e0e0e0; position: sticky; bottom: 0;">
                <button class="btn btn-primary" onclick="sendRequests()" style="width: 100%;" id="sendBtn">
                    Send Meeting Requests (0)
                </button>
            </div>
        </div>
    </div>
    
    <script>
        let currentAspirationId = null;
        let selectedStudents = [];
        
        window.addEventListener('DOMContentLoaded', function() {
            // Get aspiration ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            currentAspirationId = urlParams.get('aspiration');
            
            // Load aspiration details
            if (currentAspirationId) {
                const aspiration = getAspirationById(currentAspirationId);
                if (aspiration) {
                    document.getElementById('aspirationTitle').textContent = aspiration.name + ' - Recommendations';
                }
            }
            
            // Load recommendations
            loadRecommendations();
        });
        
        function loadRecommendations() {
            // In production, this would fetch from API based on questionnaire responses
            // For demo, show same 10 students as AI agent method
            const students = [
                { code: 'S0042', match: 85, details: 'Marketing expert • Entrepreneurial • Structured approach', color: '#3498db' },
                { code: 'S0127', match: 82, details: 'Business Development • Startup experience • Goal-oriented', color: '#27ae60' },
                { code: 'S0234', match: 78, details: 'Product Manager • AI enthusiast • Accountable partner', color: '#9b59b6' },
                { code: 'S0361', match: 75, details: 'Growth Hacker • Direct communicator • Startup founder', color: '#e67e22' },
                { code: 'S0489', match: 73, details: 'Sales expert • Tech background • Structured thinker', color: '#1abc9c' },
                { code: 'S0521', match: 70, details: 'Business Analyst • Strategic thinker • Collaborative', color: '#16a085' },
                { code: 'S0638', match: 68, details: 'Operations Manager • Process-oriented • Results-driven', color: '#34495e' },
                { code: 'S0745', match: 65, details: 'Consultant • Problem solver • Communication focused', color: '#8e44ad' },
                { code: 'S0862', match: 62, details: 'Project Manager • Organized • Team player', color: '#d35400' },
                { code: 'S0974', match: 60, details: 'Strategy Consultant • Analytical • Forward-thinking', color: '#27ae60' }
            ];
            
            const container = document.getElementById('studentsList');
            container.innerHTML = students.map(student => {
                return `
                    <div class="student-item" style="cursor: pointer;" onclick="toggleStudentSelection('${student.code}')" id="student_${student.code}">
                        <div class="student-avatar" style="background: ${student.color};">${student.code}</div>
                        <div class="student-info">
                            <div class="student-name">
                                <span class="student-code">${student.code}</span>
                                <span class="badge badge-match">${student.match}% Match</span>
                            </div>
                            <div class="student-details">
                                ${student.details}
                            </div>
                        </div>
                        <div style="color: #3498db; font-size: 1.5em; display: none;" id="check_${student.code}">✓</div>
                    </div>
                `;
            }).join('');
        }
        
        function toggleStudentSelection(studentCode) {
            const index = selectedStudents.indexOf(studentCode);
            const studentItem = document.getElementById('student_' + studentCode);
            const checkIcon = document.getElementById('check_' + studentCode);
            
            if (index > -1) {
                // Deselect
                selectedStudents.splice(index, 1);
                studentItem.style.background = '';
                checkIcon.style.display = 'none';
            } else {
                // Select
                selectedStudents.push(studentCode);
                studentItem.style.background = '#ebf5fb';
                checkIcon.style.display = 'block';
            }
            
            // Update button text
            document.getElementById('sendBtn').textContent = `Send Meeting Requests (${selectedStudents.length})`;
        }
        
        function sendRequests() {
            if (selectedStudents.length === 0) {
                alert('Please select at least one student to send a meeting request.');
                return;
            }
            
            // Store selected students
            localStorage.setItem('selected_students_requests', JSON.stringify({
                aspirationId: currentAspirationId,
                students: selectedStudents,
                sentAt: new Date().toISOString()
            }));
            
            // Show confirmation
            alert(`Meeting requests sent to ${selectedStudents.length} student(s). You'll be notified when they respond.`);
            
            // Navigate to requests sent confirmation or back to main
            window.location.href = '34-requests-sent.html';
        }
    </script>
</body>
</html>
