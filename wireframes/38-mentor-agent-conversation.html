<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Interview - RVCE Peer Finder</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="wireframe-container">
        <div class="wireframe-header">
            <a href="43-mentor-credential-verification.html" class="back-btn">←</a>
            <h1>'Get to Know You' Interview</h1>
            <div class="status-indicator online"></div>
        </div>

        <div class="voice-container" id="consentSection">
            <div style="padding: 30px; text-align: center;">
                <div class="modern-mic-container">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </div>
                <p style="color: #7f8c8d; line-height: 1.6; margin-bottom: 25px;">
                    To help us match you with the right students, we need to understand your journey, struggles, and
                    personality.
                </p>
                <div class="card"
                    style="background: #ebf5fb; border-color: #3498db; text-align: left; margin-bottom: 30px;">
                    <label style="display: flex; gap: 10px; cursor: pointer; align-items: flex-start;">
                        <input type="checkbox" id="consentCheckbox" style="margin-top: 4px;">
                        <span style="font-size: 0.9em; color: #2c3e50;">
                            I consent to sharing my story via voice for a more personalized matching experience.
                        </span>
                    </label>
                </div>
                <button class="btn btn-primary" id="startBtn" onclick="startConversation()" disabled
                    style="opacity: 0.5;">
                    Start Conversation
                </button>
            </div>
        </div>

        <div class="voice-container" id="mainConversation" style="display: none;">
            <div class="voice-messages" id="interviewMessages">
                <!-- Messages will be injected here -->
            </div>

            <div class="voice-controls">
                <div id="recordingLabel" style="font-size: 0.9em; color: #e74c3c; font-weight: 600; display: none;">
                    Recording Story...
                </div>
                <div class="visualizer" id="visualizer">
                    <div class="bar" style="animation-delay: -0.4s"></div>
                    <div class="bar" style="animation-delay: -0.2s"></div>
                    <div class="bar" style="animation-delay: 0s"></div>
                    <div class="bar" style="animation-delay: -0.2s"></div>
                    <div class="bar" style="animation-delay: -0.4s"></div>
                </div>
                <button class="voice-record-btn" id="recordBtn" onclick="toggleRecording()">
                    <div class="mic-core"></div>
                </button>
                <p style="font-size: 0.8em; color: #7f8c8d; text-align: center;">
                    Tap to speak about your personality, achievements, and struggles.
                </p>
            </div>

            <div id="submitSection" style="display: none; padding: 20px; margin-bottom: 40px;">
                <button class="btn btn-success" onclick="finishInterview()">Submit & Continue to Verification</button>
            </div>
        </div>
    </div>

    <script>
        let isRecording = false;
        let step = 0;

        // Consent logic
        document.getElementById('consentCheckbox').addEventListener('change', function (e) {
            const startBtn = document.getElementById('startBtn');
            if (e.target.checked) {
                startBtn.disabled = false;
                startBtn.style.opacity = '1';
            } else {
                startBtn.disabled = true;
                startBtn.style.opacity = '0.5';
            }
        });

        function startConversation() {
            document.getElementById('consentSection').style.display = 'none';
            document.getElementById('mainConversation').style.display = 'block';

            // Initial agent messages
            const messages = document.getElementById('interviewMessages');

            setTimeout(() => {
                const welcomeMsg = document.createElement('div');
                welcomeMsg.className = 'voice-message agent';
                welcomeMsg.innerHTML = `
                    <div class="voice-bubble">
                        Welcome! I'm your onboarding agent. To help you guide others, I need to understand your journey.
                        <div class="voice-waveform">
                            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
                        </div>
                    </div>
                `;
                messages.appendChild(welcomeMsg);

                setTimeout(() => {
                    const questionMsg = document.createElement('div');
                    questionMsg.className = 'voice-message agent';
                    questionMsg.innerHTML = `
                        <div class="voice-bubble">
                            "What was a major struggle you faced at RVCE, and how did you achieve success in it?"
                        </div>
                    `;
                    messages.appendChild(questionMsg);
                    messages.scrollTop = messages.scrollHeight;
                }, 1000);
            }, 500);
        }

        function toggleRecording() {
            const btn = document.getElementById('recordBtn');
            const label = document.getElementById('recordingLabel');
            const visualizer = document.getElementById('visualizer');
            const messages = document.getElementById('interviewMessages');

            isRecording = !isRecording;

            if (isRecording) {
                btn.classList.add('recording');
                visualizer.classList.add('recording');
                label.style.display = 'block';
            } else {
                btn.classList.remove('recording');
                visualizer.classList.remove('recording');
                label.style.display = 'none';

                // Add simulated user response
                const userMsg = document.createElement('div');
                userMsg.className = 'voice-message user';
                userMsg.innerHTML = `
                    <div class="voice-bubble">
                        "I struggled with Data Structures in 2nd year. Formed a study group and eventually topped the class and got an internship at Google."
                    </div>
                `;
                messages.appendChild(userMsg);
                messages.scrollTop = messages.scrollHeight;

                // Add next agent question
                setTimeout(() => {
                    const agentMsg = document.createElement('div');
                    agentMsg.className = 'voice-message agent';
                    agentMsg.innerHTML = `
                        <div class="voice-bubble">
                            "Impressive! Tell me about your personality. Are you a patient mentor? What are your key achievements now?"
                        </div>
                    `;
                    messages.appendChild(agentMsg);
                    messages.scrollTop = messages.scrollHeight;

                    document.getElementById('submitSection').style.display = 'block';
                }, 1000);
            }
        }

        function finishInterview() {
            localStorage.setItem('neopeer_is_mentor_pending', 'true');
            window.location.href = '72-mentor-verification-progress.html';
        }
    </script>
</body>

</html>
