<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mutual Match Found - Neopeer</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="wireframe-container">
        <div class="wireframe-header">
            <a href="../index.html" class="back-btn">←</a>
            <h1>Match Found! 🎉</h1>
            <div style="width: 60px;"></div>
        </div>
        <div class="wireframe-content">
            <div style="text-align: center; padding: 20px 0;">
                <div
                    style="width: 80px; height: 80px; background: #27ae60; border-radius: 50%; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; color: white; font-size: 2.5em;">
                    ✓
                </div>
                <h2>Mutual Interest!</h2>
                <p style="color: #7f8c8d; margin-top: 10px;">
                    <span class="student-code">S0042</span> also wants to talk to you!

            </div>

            <div class="card" style="border-color: #27ae60; background: #d4edda;">
                <div class="card-header">
                    <div>
                        <div class="card-title"><span class="student-code">S0042</span></div>

                    <span class="badge badge-match">Mutual Match</span>
                </div>
                <div class="card-content" style="margin-top: 15px;">
                    <p><strong>Both of you expressed interest!</strong></p>
                    <p style="margin-top: 10px;">Ready to schedule a meeting?</p>
                    <p style="margin-top: 10px; font-size: 0.9em; color: #155724;">
                        🔒 Identity will be revealed after the meeting if both agree to connect.
                    </p>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <button class="btn btn-primary" onclick="window.location.href='09-schedule-slots.html'">
                    Schedule Meeting
                </button>
            </div>
        </div>
    </div>
