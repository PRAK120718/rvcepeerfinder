<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consult Agent - Neopeer</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .chat-messages {
            height: calc(844px - 280px);
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: var(--bg-surface);
        }

        .message.agent .message-bubble {
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-bottom-left-radius: 4px;
        }

        .message.user .message-bubble {
            background: var(--primary);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .initial-suggestions {
            display: flex;
            overflow-x: auto;
            gap: 12px;
            padding: 16px 24px;
            background: var(--bg-surface);
            scrollbar-width: none;
        }

        .suggestion-chip {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 0.85em;
            color: var(--text-dim);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-chip:hover {
            border-color: var(--primary);
            color: var(--text-main);
        }

        .typing-indicator {
            font-size: 0.75em;
            color: var(--text-dim);
            margin: 0 24px 12px;
            display: none;
        }
    </style>
</head>

<body>
    <div class="wireframe-container" style="padding: 0; background: var(--bg-surface);">
        <div class="wireframe-header">
            <a href="javascript:history.back()" class="back-btn">←</a>
            <div style="text-align: center;">
                <h1 id="agentTitle" style="margin: 0;">SR-01's Agent</h1>
                <div
                    style="font-size: 0.65em; color: var(--primary); font-weight: 800; text-transform: uppercase; letter-spacing: 1px;">
                    AI Representative</div>
            </div>
            <div style="width: 40px;"></div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message agent">
                <div class="message-bubble">
                    Hello! I am <span id="mentorCode">SR-01</span>'s AI agent. I've been trained on their specific
                    struggles and achievements at RVCE.
                </div>
            </div>
            <div class="message agent">
                <div class="message-bubble">
                    Feel free to ask me anything about their journey or expertise.
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typing">Agent is thinking...</div>

        <div class="initial-suggestions">
            <!-- Suggestions will be loaded here -->
        </div>

        <div
            style="padding: 24px; background: var(--bg-surface); border-top: 1px solid var(--border); display: flex; gap: 12px; align-items: center;">
            <input type="text" id="userInput" class="input-field" placeholder="Ask a question..."
                style="margin-bottom: 0; border-radius: 30px;">
            <button class="btn btn-primary"
                style="width: 48px; height: 48px; border-radius: 50%; padding: 0; margin-top: 0;"
                onclick="handleSend()">
                <span style="font-size: 1.2em;">↑</span>
            </button>
        </div>

        <div style="padding: 16px 24px 32px; background: var(--bg-surface); text-align: center;">
            <button class="btn btn-primary"
                style="background: var(--bg-card); border: 1px solid var(--border); color: #fff; width: 100%; border-radius: 16px;"
                onclick="bookSession()">
                Book a Session
            </button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mentor = urlParams.get('mentor');
        const mentorCode = document.getElementById('mentorCode');
        const agentTitle = document.getElementById('agentTitle');

        const mentorData = {
            'sanjay': { code: 'SR-01', color: '#e67e22', suggestions: ['How did you handle the library grind?', 'What was your GPA strategy?', 'Internship interview tips?'] },
            'harshith': { code: 'PH-01', color: '#3498db', suggestions: ['Tips for Distributed Systems?', 'How to handle 3rd year backlogs?', 'Career growth roadmap?'] },
            'ananya': { code: 'AK-01', color: '#1abc9c', suggestions: ['How to handle introversion?', 'Coding club tips?', 'Public speaking advice?'] },
            'varun': { code: 'VK-01', color: '#8e44ad', suggestions: ['Fullstack tech stack?', 'Open source for beginners?', 'Team collaboration tips?'] },
            'megha': { code: 'MS-01', color: '#d35400', suggestions: ['UI/UX portfolio review?', 'Figma best practices?', 'User-centric design tips?'] },
            'rohit': { code: 'RP-01', color: '#27ae60', suggestions: ['Cloud certs worth it?', 'AWS vs Azure for students?', 'Infrastructure as code?'] }
        };

        if (mentor && mentorData[mentor]) {
            const data = mentorData[mentor];
            mentorCode.textContent = data.code;
            agentTitle.textContent = data.code + "'s Agent";

            // Update suggestions
            const container = document.querySelector('.initial-suggestions');
            container.innerHTML = '';
            data.suggestions.forEach(s => {
                const chip = document.createElement('div');
                chip.className = 'suggestion-chip';
                chip.textContent = s;
                chip.onclick = () => sendMessage(s);
                container.appendChild(chip);
            });
        }

        function handleSend() {
            const input = document.getElementById('userInput');
            if (input.value.trim()) {
                sendMessage(input.value);
                input.value = '';
            }
        }

        function sendMessage(text) {
            const chat = document.getElementById('chatMessages');

            // Add user message
            const userMsg = document.createElement('div');
            userMsg.className = 'message user';
            userMsg.textContent = text;
            chat.appendChild(userMsg);
            chat.scrollTop = chat.scrollHeight;

            // Show typing
            const typing = document.getElementById('typing');
            typing.style.display = 'block';

            // Simulate agent response
            setTimeout(() => {
                typing.style.display = 'none';
                const agentMsg = document.createElement('div');
                agentMsg.className = 'message agent';
                agentMsg.textContent = "That's a great question about " + mentorCode.textContent + "'s experience. Based on our data, they found that focusing on specific labs early on was key. Would you like to hear more about their strategy for that?";
                chat.appendChild(agentMsg);
                chat.scrollTop = chat.scrollHeight;
            }, 1500);
        }

        function bookSession() {
            if (mentor === 'sanjay') {
                window.location.href = '57-sanjay-call-request.html';
            } else {
                window.location.href = '41-video-call-request.html';
            }
        }
    </script>
</body>

</html>
