<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Interface - Neopeer</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="wireframe-container">
        <div class="meeting-container">
            <div class="meeting-header">
                <div>
                    <strong>Meeting with <span class="student-code" style="color: white;">S0042</span></strong>
                    <div style="font-size: 0.85em; color: #95a5a6; margin-top: 5px;">
                        2:00 PM - 3:00 PM
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="recordingStatus" style="font-size: 0.85em; color: #27ae60;">● Recording</span>
                    <span style="font-size: 0.85em;">00:25:30</span>
                </div>
            </div>

            <div class="meeting-participants">
                <div class="participant-box">
                    <div style="text-align: center;">
                        <div style="font-size: 3em; margin-bottom: 10px;">👤</div>
                        <div>You</div>
                        <div style="font-size: 0.8em; color: #95a5a6; margin-top: 5px;">Speaking</div>
                    </div>
                </div>

                <div style="width: 100%; height: 1px; background: #3c3c3c; margin: 20px 0;"></div>

                <div class="participant-box">
                    <div style="text-align: center;">
                        <div style="font-size: 3em; margin-bottom: 10px;">👤</div>
                        <div class="student-code" style="color: white; font-family: 'Courier New', monospace;">S0042
                        </div>
                        <div style="font-size: 0.8em; color: #95a5a6; margin-top: 5px;">Listening</div>
                    </div>
                </div>

                <div
                    style="margin-top: 30px; padding: 15px; background: #2c2c2c; border-radius: 5px; text-align: center;">
                    <p style="font-size: 0.9em; color: #95a5a6;">
                        📝 Meeting notes are being automatically generated
                    </p>
                </div>
            </div>

            <div class="meeting-controls">
                <button class="control-btn" title="Mute/Unmute" id="muteBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
                <button class="control-btn active" title="Leave Meeting"
                    onclick="window.location.href='18-consent-options.html'" style="background: #ef4444;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91">
                        </path>
                        <line x1="23" y1="1" x2="1" y2="23"></line>
                    </svg>
                </button>
                <button class="control-btn" title="More Options">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="19" cy="12" r="1"></circle>
                        <circle cx="5" cy="12" r="1"></circle>
                    </svg>
                </button>
            </div>

            <div style="padding: 15px; background: #1a1a1a; border-top: 1px solid #3c3c3c; text-align: center;">
                <p style="font-size: 0.85em; color: #95a5a6;">
                    ⚠️ Camera disabled - Audio-only meeting
                </p>
            </div>
        </div>
    </div>

    <script>
        // Check meeting preferences for recording consent
        const preferences = JSON.parse(localStorage.getItem('meeting_preferences') || '{}');
        if (!preferences.recording) {
            const recordingStatus = document.getElementById('recordingStatus');
            if (recordingStatus) {
                recordingStatus.textContent = '● Not Recording';
                recordingStatus.style.color = '#95a5a6';
            }
        }
    </script>
</body>

</html>
