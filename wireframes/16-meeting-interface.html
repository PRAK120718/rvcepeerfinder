<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meeting Interface - Neopeer</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
    <div class="wireframe-container">
        <div class="meeting-container">
            <div class="meeting-header">
                <div>
                    <strong>Meeting with <span class="student-code" style="color: white;">S0042</span></strong>
                    <div style="font-size: 0.85em; color: #95a5a6; margin-top: 5px;">
                        2:00 PM - 3:00 PM
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="recordingStatus" style="font-size: 0.85em; color: #27ae60;">● Recording</span>
                    <span style="font-size: 0.85em;">00:25:30</span>
                </div>
            </div>
            
            <div class="meeting-participants">
                <div class="participant-box">
                    <div style="text-align: center;">
                        <div style="font-size: 3em; margin-bottom: 10px;">👤</div>
                        <div>You</div>
                        <div style="font-size: 0.8em; color: #95a5a6; margin-top: 5px;">Speaking</div>
                    </div>
                </div>
                
                <div style="width: 100%; height: 1px; background: #3c3c3c; margin: 20px 0;"></div>
                
                <div class="participant-box">
                    <div style="text-align: center;">
                        <div style="font-size: 3em; margin-bottom: 10px;">👤</div>
                        <div class="student-code" style="color: white; font-family: 'Courier New', monospace;">S0042</div>
                        <div style="font-size: 0.8em; color: #95a5a6; margin-top: 5px;">Listening</div>
                    </div>
                </div>
                
                <div style="margin-top: 30px; padding: 15px; background: #2c2c2c; border-radius: 5px; text-align: center;">
                    <p style="font-size: 0.9em; color: #95a5a6;">
                        📝 Meeting notes are being automatically generated
                    </p>
                </div>
            </div>
            
            <div class="meeting-controls">
                <button class="control-btn" title="Mute/Unmute">🎤</button>
                <button class="control-btn active" title="Leave Meeting" onclick="window.location.href='17-meeting-notes.html'">📞</button>
                <button class="control-btn" title="More Options">⋯</button>
            </div>
            
            <div style="padding: 15px; background: #1a1a1a; border-top: 1px solid #3c3c3c; text-align: center;">
                <p style="font-size: 0.85em; color: #95a5a6;">
                    ⚠️ Camera disabled - Audio-only meeting
                </p>
            </div>
        </div>
    </div>
    
    <script>
        // Check meeting preferences for recording consent
        const preferences = JSON.parse(localStorage.getItem('meeting_preferences') || '{}');
        if (!preferences.recording) {
            document.getElementById('recordingStatus').textContent = '● Not Recording';
            document.getElementById('recordingStatus').style.color = '#95a5a6';
        }
    </script>
</body>
</html>
