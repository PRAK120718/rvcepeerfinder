<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RVCE Peer Finder - Login</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="wireframe-container">
        <!-- Mentor Teaser -->
        <div style="padding: 24px 24px 0 24px;">
            <div class="card"
                style="background: linear-gradient(135deg, #F9FAFB, #F3F4F6); border-color: var(--border); margin: 0; padding: 20px;">
                <h4
                    style="color: var(--primary); margin: 0; font-size: 0.9em; letter-spacing: 1px; text-transform: uppercase;">
                    ✨ Help the Community</h4>
                <p style="color: var(--text-dim); margin: 4px 0 15px 0; font-size: 0.8em; line-height: 1.4;">
                    Help others navigate the RVCE journey and get paid for your expertise.
                </p>
                <a href="37-mentor-onboarding-intro.html" class="btn btn-primary"
                    style="width: auto; padding: 10px 20px; font-size: 0.75em; border-radius: 12px; background: var(--primary); box-shadow: none; margin-top: 0;">
                    Join now
                </a>
            </div>
        </div>

        <div class="wireframe-content"
            style="display: flex; flex-direction: column; justify-content: center; min-height: 700px;">
            <div style="text-align: center;">
                <div style="margin-bottom: 48px;">
                    <div
                        style="width: 80px; height: 80px; background: var(--primary); border-radius: 24px; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 2.5em; transform: rotate(-5deg); box-shadow: 0 20px 40px rgba(99, 102, 241, 0.3);">
                        🧑‍🤝‍🧑</div>
                    <h2 style="font-size: 2.2em; margin-bottom: 8px;">Neopeer</h2>
                    <p style="font-size: 1em; color: var(--text-dim);">
                        The RVCE Peer Network.
                    </p>
                </div>

                <div
                    style="background: rgba(245, 158, 11, 0.05); border: 1px solid rgba(245, 158, 11, 0.2); border-radius: 16px; padding: 16px; margin-bottom: 32px;">
                    <p style="color: #F59E0B; font-size: 0.85em; margin: 0; font-weight: 600;">
                        🔒 RVCE Login Required<br>
                        <span style="font-weight: 400; opacity: 0.8;">Use your @rvce.edu.in email to proceed.</span>
                    </p>
                </div>

                <div style="text-align: left;">
                    <label class="label">College Email</label>
                    <input type="email" id="email" class="input-field" placeholder="your.name@rvce.edu.in"
                        style="margin-bottom: 24px;">

                    <button class="btn btn-primary" onclick="sendOTP()">
                        Get Started
                    </button>
                </div>

                <div id="errorMessage"
                    style="display: none; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); border-radius: 12px; padding: 14px; margin-top: 24px; color: #ef4444; font-size: 0.9em;">
                    <strong>Error:</strong> <span id="errorText"></span>
                </div>
            </div>

            <div style="margin-top: 64px; text-align: center;">
                <p style="color: var(--text-dim); font-size: 0.85em; margin: 0; opacity: 0.6;">
                    Built for <strong style="color: var(--text-main);">RVCE Explorers</strong>
                </p>
            </div>
        </div>
    </div>

    <script>
        function sendOTP() {
            const emailInput = document.getElementById('email');
            const email = emailInput.value.trim();
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            // Hide error message
            errorDiv.style.display = 'none';

            // Validate email format
            if (!email) {
                errorText.textContent = 'Please enter your RVCE email address';
                errorDiv.style.display = 'block';
                emailInput.focus();
                return;
            }

            // Validate RVCE email domain
            const rvceEmailPattern = /^[a-zA-Z0-9._-]+@rvce\.edu\.in$/i;
            if (!rvceEmailPattern.test(email)) {
                errorText.textContent = 'Please enter a valid RVCE email address (@rvce.edu.in)';
                errorDiv.style.display = 'block';
                emailInput.focus();
                return;
            }

            // Store email in localStorage
            localStorage.setItem('rvce_user_email', email);

            // In a real app, this would send OTP to the email
            // For wireframe purposes, we'll simulate this and go to OTP page
            // Simulate OTP sending (in production, this would be an API call)
            const otpData = {
                email: email,
                sentAt: new Date().toISOString(),
                // In production, OTP would be generated on server
                // For wireframe demo, we'll use a fixed OTP: 123456
                otp: '123456'
            };
            localStorage.setItem('rvce_otp_data', JSON.stringify(otpData));

            // Navigate to OTP verification page
            window.location.href = '00-otp-verification.html';
        }

        // Allow Enter key to submit
        document.getElementById('email').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendOTP();
            }
        });

        // Auto-focus email input on load
        window.addEventListener('DOMContentLoaded', function () {
            document.getElementById('email').focus();
        });
    </script>
</body>

</html>
