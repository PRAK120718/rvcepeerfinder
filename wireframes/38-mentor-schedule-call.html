<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentor Interview - RVCE Peer Finder</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="wireframe-container">
        <div class="wireframe-header">
            <a href="43-mentor-credential-verification.html" class="back-btn">←</a>
            <h1>Schedule Your Verification Call</h1>
            <div style="width: 40px;"></div>
        </div>

        <div class="wireframe-content" style="padding: 24px;">
            <p style="color: #64748b; font-size: 0.95em; line-height: 1.6; margin-bottom: 32px; text-align: center;">
                To finalize your mentor profile, please pick a 15-minute slot for a quick introductory video call with
                our team.
            </p>

            <!-- Date Selection -->
            <div style="margin-bottom: 32px;">
                <label class="label" style="font-weight: 700; margin-bottom: 16px; display: block;">Select Date</label>
                <div style="display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none;">
                    <div class="date-chip selected" onclick="selectDate(this)">
                        <span class="day-name">Mon</span>
                        <span class="day-num">02</span>
                        <span class="month">Feb</span>
                    </div>
                    <div class="date-chip" onclick="selectDate(this)">
                        <span class="day-name">Tue</span>
                        <span class="day-num">03</span>
                        <span class="month">Feb</span>
                    </div>
                    <div class="date-chip" onclick="selectDate(this)">
                        <span class="day-name">Wed</span>
                        <span class="day-num">04</span>
                        <span class="month">Feb</span>
                    </div>
                    <div class="date-chip" onclick="selectDate(this)">
                        <span class="day-name">Thu</span>
                        <span class="day-num">05</span>
                        <span class="month">Feb</span>
                    </div>
                </div>
            </div>

            <!-- Time Selection -->
            <div style="margin-bottom: 40px;">
                <label class="label" style="font-weight: 700; margin-bottom: 16px; display: block;">Select Time
                    (IST)</label>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;">
                    <button class="time-slot" onclick="selectTime(this)">10:00 AM</button>
                    <button class="time-slot" onclick="selectTime(this)">10:30 AM</button>
                    <button class="time-slot" onclick="selectTime(this)">11:15 AM</button>
                    <button class="time-slot" onclick="selectTime(this)">02:00 PM</button>
                    <button class="time-slot selected" onclick="selectTime(this)">03:30 PM</button>
                    <button class="time-slot" onclick="selectTime(this)">04:45 PM</button>
                </div>
            </div>

            <div
                style="background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 16px; padding: 16px; margin-bottom: 40px;">
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div style="font-size: 1.5em;">🎥</div>
                    <div>
                        <p style="margin: 0; font-size: 0.85em; font-weight: 600; color: #475569;">Verification Call
                            (15m)</p>
                        <p style="margin: 0; font-size: 0.75em; color: #94a3b8;">Via Google Meet · Link provided after
                            booking</p>
                    </div>
                </div>
            </div>

            <button class="btn btn-primary" id="confirmBooking" onclick="confirmBooking()"
                style="border-radius: 50px; background: #e67e22; height: 54px; font-weight: 700;">
                Confirm Booking →
            </button>
        </div>
    </div>

    <style>
        .date-chip {
            flex: 0 0 80px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .date-chip:hover {
            border-color: #e67e22;
            background: #fff8f1;
        }

        .date-chip.selected {
            background: #e67e22;
            border-color: #e67e22;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(230, 126, 34, 0.3);
        }

        .date-chip .day-name {
            font-size: 0.7em;
            text-transform: uppercase;
            font-weight: 700;
            opacity: 0.8;
        }

        .date-chip .day-num {
            font-size: 1.2em;
            font-weight: 800;
        }

        .date-chip .month {
            font-size: 0.7em;
            font-weight: 600;
        }

        .date-chip.selected * {
            color: white;
            opacity: 1;
        }

        .time-slot {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px;
            font-size: 0.85em;
            font-weight: 600;
            color: #475569;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .time-slot:hover {
            border-color: #e67e22;
            color: #e67e22;
        }

        .time-slot.selected {
            background: #e67e22;
            border-color: #e67e22;
            color: white;
            box-shadow: 0 10px 15px -3px rgba(230, 126, 34, 0.3);
        }
    </style>

    <script>
        function selectDate(el) {
            document.querySelectorAll('.date-chip').forEach(d => d.classList.remove('selected'));
            el.classList.add('selected');
        }

        function selectTime(el) {
            document.querySelectorAll('.time-slot').forEach(t => t.classList.remove('selected'));
            el.classList.add('selected');
        }

        function confirmBooking() {
            const btn = document.getElementById('confirmBooking');
            btn.innerHTML = 'Booking...';
            btn.style.opacity = '0.7';
            btn.disabled = true;

            setTimeout(() => {
                localStorage.setItem('neopeer_is_mentor_pending', 'true');
                localStorage.setItem('neopeer_call_scheduled', 'true');
                window.location.href = '72-mentor-verification-progress.html';
            }, 1000);
        }
    </script>
</body>

</html>
