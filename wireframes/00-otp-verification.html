<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neopeer - Verify OTP</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="manifest" href="../manifest.json">
</head>

<body style="background: var(--bg-main);">
    <div class="app-shell">
        <div class="main-container">
            <!-- Desktop Sidebar (Simplified for Auth) -->
            <aside class="desktop-sidebar">
                <div
                    style="font-size: 1.5em; font-weight: 800; color: var(--primary); margin-bottom: 40px; display: flex; align-items: center; gap: 12px;">
                    <span>🧑‍🤝‍🧑</span> Neopeer
                </div>
                <nav style="display: flex; flex-direction: column; gap: 8px;">
                    <a href="00-landing.html" class="nav-link">🏠 Return Home</a>
                </nav>
            </aside>

            <!-- Main Content Area -->
            <main class="content-area">
                <div class="container" style="max-width: none; background: transparent; padding: 0;">
                    <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 32px;">
                        <a href="00-landing.html"
                            style="text-decoration: none; color: var(--text-dim); font-size: 1.2em;">←</a>
                        <h1 style="margin: 0;">Verify OTP</h1>
                    </div>

                    <div style="display: flex; flex-direction: column; justify-content: center; min-height: 60vh;">
                        <div style="text-align: center; padding: 20px;">
                            <div style="margin-bottom: 30px;">
                                <h2>Enter OTP</h2>
                                <p style="color: var(--text-dim); margin-top: 10px;">
                                    We've sent a 6-digit OTP to<br>
                                    <strong id="emailDisplay" style="color: var(--text-main);"></strong>
                                </p>
                            </div>

                            <div
                                style="background: var(--bg-card); padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow); max-width: 440px; margin: 0 auto;">
                                <div
                                    style="background: rgba(99, 102, 241, 0.05); border-radius: 12px; padding: 20px; margin-bottom: 24px; border: 1px dashed var(--primary);">
                                    <p style="color: var(--primary); font-size: 0.9em; margin: 0; font-weight: 700;">
                                        📥 Check your inbox
                                    </p>
                                    <p
                                        style="color: var(--text-dim); font-size: 0.85em; margin: 4px 0 0 0; line-height: 1.4;">
                                        Enter the <strong>6-digit verification code</strong> we just sent to your
                                        college email.
                                    </p>
                                </div>

                                <div style="margin-bottom: 24px;">
                                    <input type="text" id="otpInput" class="input-field" placeholder="······"
                                        maxlength="6"
                                        style="text-align: center; font-size: 2.2em; letter-spacing: 12px; font-weight: 800; height: 74px; background: var(--bg-surface); border: 2px solid var(--border); border-radius: 16px; color: var(--primary);"
                                        autocomplete="one-time-code">
                                </div>

                                <button class="btn btn-primary" onclick="verifyOTP()"
                                    style="height: 54px; font-size: 1.1em; margin-bottom: 16px;">
                                    Verify & Continue →
                                </button>

                                <div
                                    style="display: flex; justify-content: center; gap: 8px; align-items: center; margin-top: 8px;">
                                    <span style="color: var(--text-dim); font-size: 0.85em;">Didn't get a code?</span>
                                    <button onclick="resendOTP()"
                                        style="background: none; border: none; color: var(--primary); font-weight: 700; font-size: 0.85em; cursor: pointer; padding: 0; text-decoration: underline;">
                                        Resend Code
                                    </button>
                                </div>
                            </div>

                            <div id="errorMessage"
                                style="display: none; background: #fee2e2; border: 1px solid #ef4444; border-radius: 12px; padding: 16px; margin-top: 24px; color: #991b1b; max-width: 440px; margin-left: auto; margin-right: auto;">
                                <strong>Error:</strong> <span id="errorText"></span>
                            </div>

                            <div id="successMessage"
                                style="display: none; background: #dcfce7; border: 1px solid #22c55e; border-radius: 12px; padding: 16px; margin-top: 24px; color: #166534; max-width: 440px; margin-left: auto; margin-right: auto;">
                                <strong>Success!</strong> OTP verified successfully. Redirecting...
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Mobile Bottom Nav (Usually Hidden for OTP but keeping for shell consistency) -->
    <nav class="bottom-nav mobile-only">
        <a href="00-landing.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </a>
    </nav>

    <div style="margin-top: auto; padding: 20px; text-align: center; border-top: 1px solid #e0e0e0;">
        <p style="color: #7f8c8d; font-size: 0.9em; margin: 0;">
            Powered by <strong style="color: #3498db;">Neopeer</strong>
        </p>
    </div>
    </div>
    </div>

    <script>
        // Display email on page load
        window.addEventListener('DOMContentLoaded', function () {
            const email = localStorage.getItem('rvce_user_email');
            if (email) {
                document.getElementById('emailDisplay').textContent = email;
            } else {
                // No email found, redirect to login
                window.location.href = '00-landing.html';
            }

            // Auto-populate OTP for demo
            const otpInput = document.getElementById('otpInput');
            otpInput.value = '123456';
            otpInput.focus();

            // Only allow numeric input
            otpInput.addEventListener('input', function (e) {
                this.value = this.value.replace(/[^0-9]/g, '');
            });
        });

        function verifyOTP() {
            // Demo: skip all validation, proceed directly
            localStorage.setItem('rvce_authenticated', 'true');
            localStorage.setItem('rvce_auth_time', new Date().toISOString());
            window.location.href = '00-overall-consent.html';
        }

        function resendOTP() {
            const email = localStorage.getItem('rvce_user_email');
            if (!email) {
                window.location.href = '00-landing.html';
                return;
            }

            // In a real app, this would resend OTP via API
            // For wireframe, we'll regenerate and store OTP
            const otpData = {
                email: email,
                sentAt: new Date().toISOString(),
                otp: '123456' // Demo OTP
            };
            localStorage.setItem('rvce_otp_data', JSON.stringify(otpData));

            // Show success message
            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');
            errorDiv.style.display = 'none';
            successDiv.innerHTML = '<strong>OTP Resent!</strong> Please check your email for the new code.';
            successDiv.style.background = '#d1ecf1';
            successDiv.style.borderColor = '#3498db';
            successDiv.style.color = '#0c5460';
            successDiv.style.display = 'block';

            // Clear OTP input
            document.getElementById('otpInput').value = '';
            document.getElementById('otpInput').focus();
        }

        // Allow Enter key to submit
        document.getElementById('otpInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                verifyOTP();
            }
        });
    </script>
    <script src="../pwa-init.js"></script>
</body>

</html>
