<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credential Verification - RVCE Peer Finder</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="wireframe-container">
        <div class="wireframe-header">
            <a href="45-mentor-otp-verification.html" class="back-btn">←</a>
            <h1>Create Your Profile</h1>
            <div style="width: 40px;"></div>
        </div>
        <div class="wireframe-content">
            <div style="text-align: center; margin-bottom: 30px;">
                <div style="font-size: 3em; margin-bottom: 20px;">👤</div>
                <h2>Setup Your Profile</h2>
                <p style="color: #7f8c8d; margin-top: 10px;">
                    Provide your professional links and identifiers to help us curate your success story.
                </p>
            </div>

            <div style="margin-top: 20px;">
                <div class="label">LinkedIn Profile URL</div>
                <input type="url" class="input-field" placeholder="https://linkedin.com/in/yourprofile">

                <div class="label">RVCE USN / Employee ID</div>
                <input type="text" class="input-field" placeholder="e.g., 1RV22CS000 or EMP123">
            </div>

            <div style="margin-top: 10px;">
                <div class="label">Expertise Category</div>
                <select class="input-field" style="width: 100%; height: 45px; background: white;">
                    <option>Technical Expertise (Coding/Engg)</option>
                    <option>Career Guidance</option>
                    <option>Soft Skills / Public Speaking</option>
                    <option>Struggle Recovery / Mental Growth</option>
                </select>
            </div>

            <div
                style="margin-top: 25px; padding: 15px; background: #e8f8f5; border-radius: 8px; border-left: 4px solid #1abc9c;">
                <p style="font-size: 0.85em; color: #16a085; margin: 0;">
                    <strong>Note:</strong> Internal verification usually takes 24-48 hours once your profile is
                    submitted.
                </p>
            </div>

            <div style="margin-top: 40px; text-align: center;">
                <button class="btn btn-primary" onclick="window.location.href='38-mentor-agent-conversation.html'"
                    style="background: #e67e22; border-radius: 50px;">
                    Continue
                </button>
            </div>
        </div>
    </div>
</body>

</html>
