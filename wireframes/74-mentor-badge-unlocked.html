<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badge Unlocked! - Neopeer</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .congrats-card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 20;
            border: 2px solid #f1c40f;
            animation: slideUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .badge-zoom {
            font-size: 5em;
            margin-bottom: 20px;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }
    </style>
</head>

<body style="background: #fffdf5;">
    <div class="wireframe-container"
        style="display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden;">
        <div class="confetti-container">
            <!-- Simulated confetti with emojis -->
            <div style="position: absolute; top: -10%; left: 10%; font-size: 2em; animation: fall 3s infinite;">✨</div>
            <div style="position: absolute; top: -10%; left: 30%; font-size: 1.5em; animation: fall 4s infinite;">🎉
            </div>
            <div style="position: absolute; top: -10%; left: 50%; font-size: 2.5em; animation: fall 2.5s infinite;">⭐
            </div>
            <div style="position: absolute; top: -10%; left: 70%; font-size: 2em; animation: fall 3.5s infinite;">✨
            </div>
            <div style="position: absolute; top: -10%; left: 90%; font-size: 1.8em; animation: fall 4.5s infinite;">🎉
            </div>
        </div>

        <div class="congrats-card">
            <div class="badge-zoom">🎖️</div>
            <h1 style="color: #2c3e50; font-size: 2em; margin-bottom: 12px;">Badge Earned!</h1>
            <p style="color: #e67e22; font-weight: 800; font-size: 1.2em; margin-bottom: 24px;">"Paid It Forward"</p>

            <div
                style="background: rgba(39, 174, 96, 0.05); padding: 20px; border-radius: 16px; margin-bottom: 30px; text-align: left;">
                <p style="font-size: 0.9em; line-height: 1.6; color: #2c3e50;">
                    Congratulations! You've received <strong>3 consecutive 5-star ratings</strong> from the student
                    community.
                </p>
                <ul style="font-size: 0.85em; color: #7f8c8d; margin-top: 12px; padding-left: 20px;">
                    <li>Custom hourly pricing enabled</li>
                    <li>Priority placement in recommendations</li>
                    <li>Official 'Expert' verification badge</li>
                </ul>
            </div>

            <button class="btn btn-primary" style="background: #2c3e50; width: 100%; height: 56px; border-radius: 28px;"
                onclick="window.location.href='46-mentor-dashboard-unlocked.html'">Go to My Dashboard →</button>
        </div>
    </div>

    <style>
        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }
    </style>
</body>

</html>
