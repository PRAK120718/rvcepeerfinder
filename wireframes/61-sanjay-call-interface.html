<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Call - SR-01</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="manifest" href="../manifest.json">
    <style>
        .video-container {
            position: relative;
            width: 100%;
            height: calc(800px - 100px);
            background: #2c3e50;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mentor-main-view {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1);
        }

        .student-pip {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 140px;
            background: #333;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8em;
        }

        .call-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(44, 62, 80, 0.8);
            padding: 10px 25px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
        }

        .control-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.2em;
        }

        .active-speaker-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(230, 126, 34, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="wireframe-container" style="padding: 0;">
        <div class="video-container">
            <img src="https://via.placeholder.com/400x800/e67e22/ffffff?text=Student+Mentor+SR-01"
                class="mentor-main-view">

            <div class="active-speaker-tag">● STUDENT MENTOR SR-01</div>

            <div
                style="position: absolute; bottom: 100px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #bdc3c7; padding: 8px 20px; border-radius: 20px; font-size: 0.85em; backdrop-filter: blur(4px); z-index: 10;">
                📝 Meeting notes are being automatically generated
            </div>

            <div class="student-pip">
                You
            </div>

            <div class="call-controls">
                <button class="control-btn" style="background: white; color: #2c3e50;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    </svg>
                </button>
                <button class="control-btn" style="background: white; color: #2c3e50;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="23 7 16 12 23 17 23 7"></polygon>
                        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
                    </svg>
                </button>
                <button class="control-btn" style="background: #e74c3c; color: white;"
                    onclick="window.location.href='62-sanjay-call-feedback.html'">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M10.68 13.31a16 16 0 0 0 3.41 2.6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7 2 2 0 0 1 1.72 2v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.42 19.42 0 0 1-3.33-2.67m-2.67-3.34a19.79 19.79 0 0 1-3.07-8.63A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91">
                        </path>
                        <line x1="23" y1="1" x2="1" y2="23"></line>
                    </svg>
                </button>
                <button class="control-btn" style="background: white; color: #2c3e50;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.9A8.38 8.38 0 0 1 4 11.3a8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z">
                        </path>
                    </svg>
                </button>
            </div>

            <div
                style="position: absolute; bottom: 100px; left: 20px; color: white; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 8px; font-size: 0.8em;">
                🕒 42:15 remaining
            </div>
        </div>
    </div>
    <script src="../pwa-init.js"></script>
</body>

</html>
