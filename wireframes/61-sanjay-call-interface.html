<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guidance with Sanjay - RVCE Peer Finder</title>
    <link rel="stylesheet" href="../styles.css">
    <style>
        .video-container {
            position: relative;
            width: 100%;
            height: calc(800px - 100px);
            background: #2c3e50;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mentor-main-view {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: contrast(1.1);
        }

        .student-pip {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 140px;
            background: #333;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.8em;
        }

        .call-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(44, 62, 80, 0.8);
            padding: 10px 25px;
            border-radius: 40px;
            backdrop-filter: blur(5px);
        }

        .control-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.2em;
        }

        .active-speaker-tag {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(230, 126, 34, 0.9);
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="wireframe-container" style="padding: 0;">
        <div class="video-container">
            <img src="https://via.placeholder.com/400x800/e67e22/ffffff?text=Student+Mentor+SR-01"
                class="mentor-main-view">

            <div class="active-speaker-tag">● STUDENT MENTOR SR-01</div>

            <div class="student-pip">
                You
            </div>

            <div class="call-controls">
                <button class="control-btn" style="background: white; color: #2c3e50;">🎤</button>
                <button class="control-btn" style="background: white; color: #2c3e50;">📷</button>
                <button class="control-btn" style="background: #e74c3c; color: white;"
                    onclick="window.location.href='62-sanjay-call-feedback.html'">📞</button>
                <button class="control-btn" style="background: white; color: #2c3e50;">💬</button>
            </div>

            <div
                style="position: absolute; bottom: 100px; left: 20px; color: white; background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 8px; font-size: 0.8em;">
                🕒 42:15 remaining
            </div>
        </div>
    </div>
</body>

</html>
