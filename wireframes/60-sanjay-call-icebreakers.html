<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Icebreakers - SR-01 - RVCE Peer Finder</title>
    <link rel="stylesheet" href="../styles.css">
    <link rel="manifest" href="../manifest.json">
</head>

<body>
    <div class="wireframe-container">
        <div class="wireframe-header" style="background: #e67e22;">
            <div style="width: 40px;"></div>
            <h1>Warm Up</h1>
            <div style="width: 40px;"></div>
        </div>
        <div class="wireframe-content">
            <div
                style="background: #fff5eb; padding: 25px; border-radius: 12px; text-align: center; margin-bottom: 30px;">
                <div
                    style="width: 80px; height: 80px; border: 4px solid #e67e22; border-radius: 50%; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; background: white; font-size: 2em;">
                    SR
                </div>
                <h2 style="border: none; margin: 0; color: #2c3e50;">SR-01 is opening notes...</h2>
                <p style="color: #e67e22; font-weight: 600; font-size: 0.9em; margin-top: 5px;">Starting in 1:15</p>
            </div>

            <div style="margin-bottom: 20px;">
                <h3 style="font-size: 1.1em; color: #2c3e50; margin-bottom: 15px;">🎒 Quick Thoughts for Mentors</h3>
                <p style="color: #7f8c8d; font-size: 0.9em; margin-bottom: 20px;">Your mentor wants to know where you're
                    coming from. This helps tailor the advice.</p>
            </div>

            <div class="card" style="margin-bottom: 15px; border-left: 4px solid #3498db;">
                <p style="font-weight: 600; font-size: 0.9em; margin-top: 0;">Which math concept is making you lose
                    sleep right now?</p>
                <textarea class="textarea-field" placeholder="e.g. Eigenvalues are a headache..."
                    style="margin-top: 10px;"></textarea>
            </div>

            <div class="card" style="margin-bottom: 15px; border-left: 4px solid #27ae60;">
                <p style="font-weight: 600; font-size: 0.9em; margin-top: 0;">What's your 'End Goal' for this semester?
                    (Be specific!)</p>
                <textarea class="textarea-field" placeholder="e.g. Secure a 9.0+ and start coding for internships..."
                    style="margin-top: 10px;"></textarea>
            </div>

            <div style="margin-top: 30px;">
                <button class="btn btn-primary" style="background: #e67e22;"
                    onclick="window.location.href='61-sanjay-call-interface.html'">Join SR-01 in Room</button>
            </div>
        </div>
    </div>
    <script src="../pwa-init.js"></script>
</body>

</html>
