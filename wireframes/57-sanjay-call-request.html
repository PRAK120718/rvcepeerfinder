<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Session with Sanjay - RVCE Peer Finder</title>
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <div class="wireframe-container">
        <div class="wireframe-header">
            <a href="56-sanjay-success-profile.html" class="back-btn">←</a>
            <h1>Request Guidance</h1>
            <div style="width: 40px;"></div>
        </div>
        <div class="wireframe-content">
            <div style="text-align: center; margin-bottom: 30px;">
                <div
                    style="width: 60px; height: 60px; border-radius: 50%; background: #e67e22; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 1.2em;">
                    SR</div>
                <h2 style="border: none; margin: 0;">Student Mentor SR-01</h2>
                <p style="color: #7f8c8d; font-size: 0.9em;">Fee: ₹150 for 45-min session</p>
            </div>

            <div class="card">
                <div class="label">Choose Session Date</div>
                <input type="date" class="input-field" value="2026-01-26">

                <div class="label" style="margin-top: 15px;">Choose Slot</div>
                <div class="time-slot selected">
                    <div class="time-slot-header">
                        <span class="time-slot-time">05:00 PM - 05:45 PM</span>
                        <span class="time-slot-status">Available</span>
                    </div>
                </div>
                <div class="time-slot">
                    <div class="time-slot-header">
                        <span class="time-slot-time">06:00 PM - 06:45 PM</span>
                        <span class="time-slot-status">Available</span>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="label">What's the specific hurdle?</div>
                <textarea class="textarea-field"
                    placeholder="e.g., I'm finding Engg Maths-II really hard, specifically vector calculus..."></textarea>
            </div>

            <div
                style="padding: 15px; background: #fff3cd; border-radius: 8px; margin: 20px 0; border: 1px solid #ffeeba;">
                <p style="font-size: 0.85em; color: #856404; margin: 0;">
                    <strong>Note:</strong> Payment will stay in escrow until the session is completed and both peers are
                    satisfied.
                </p>
            </div>

            <button class="btn btn-primary" style="background: #e67e22; border-radius: 50px;"
                onclick="window.location.href='58-sanjay-call-status.html'">
                Send Request to SR-01
            </button>
        </div>
    </div>
</body>

</html>
